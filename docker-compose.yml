name: mai-stack

x-ollama: &ollama-env
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}

services:

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes: [redis-data:/data]
    networks: [mai]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    volumes: [qdrant-data:/qdrant/storage]
    networks: [mai]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:6333/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  mai-registry:
    build: ./mai-registry
    restart: unless-stopped
    environment:
      PORT: 3459
      DB_PATH: /data/registry.db
      CONFIG_PATH: /config/projects.yml
      REDIS_URL: redis://redis:6379
    volumes:
      - registry-data:/data
      - ./config/projects.yml:/config/projects.yml:ro
    ports: ["3459:3459"]
    networks: [mai]
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3459/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  mai-project-mcp:
    build: ./mai-project-mcp
    restart: unless-stopped
    environment:
      PORT: 3456
      HOST: "0.0.0.0"
      DB_PATH: /data/mai.db
      REDIS_URL: redis://redis:6379
    volumes: [project-db:/data]
    networks: [mai]
    depends_on:
      redis:
        condition: service_healthy

  mai-code-mcp:
    build: ./mai-code-mcp
    restart: unless-stopped
    environment:
      <<: *ollama-env
      PORT: 3457
      QDRANT_URL: http://qdrant:6333
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-ollama:nomic-embed-text}
      REGISTRY_URL: http://mai-registry:3459
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      COHERE_API_KEY: ${COHERE_API_KEY:-}
    volumes:
      - ${WORKSPACES_PATH:-/tmp/workspaces}:/workspaces:ro
    networks: [mai]
    depends_on:
      qdrant:
        condition: service_healthy
      mai-registry:
        condition: service_healthy

volumes:
  redis-data:
  qdrant-data:
  registry-data:
  project-db:

networks:
  mai:
    driver: bridge

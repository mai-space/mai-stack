name: mai-stack

x-ollama: &ollama-env
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}

services:

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes: [redis-data:/data]
    networks: [mai]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    volumes: [qdrant-data:/qdrant/storage]
    networks: [mai]
    # NOTE: qdrant image ships no curl/wget, so an HTTP healthcheck can't run
    # in-container. code-mcp depends on service_started and retries with backoff.

  mai-registry:
    build: ./mai-registry
    restart: unless-stopped
    environment:
      PORT: 3459
      DB_PATH: /data/registry.db
      CONFIG_PATH: /config/projects.yml
      REDIS_URL: redis://redis:6379
    volumes:
      - registry-data:/data
      - ./config/projects.yml:/config/projects.yml:ro
    ports: ["3459:3459"]
    networks: [mai]
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3459/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  mai-project-mcp:
    build: ./mai-project-mcp
    restart: unless-stopped
    environment:
      PORT: 3456
      HOST: "0.0.0.0"
      DB_PATH: /data/mai.db
      REDIS_URL: redis://redis:6379
    volumes: [project-db:/data]
    networks: [mai]
    depends_on:
      redis:
        condition: service_healthy

  mai-code-mcp:
    build: ./mai-code-mcp
    restart: unless-stopped
    environment:
      <<: *ollama-env
      PORT: 3457
      QDRANT_URL: http://qdrant:6333
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-ollama:nomic-embed-text}
      REGISTRY_URL: http://mai-registry:3459
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${WORKSPACES_PATH:-/tmp/workspaces}:/workspaces:ro
    networks: [mai]
    depends_on:
      qdrant:
        condition: service_started
      mai-registry:
        condition: service_healthy

  mai-watcher:
    build: ./mai-watcher
    restart: unless-stopped
    environment:
      REDIS_URL: redis://redis:6379
      REGISTRY_URL: http://mai-registry:3459
      DEBOUNCE_MS: ${WATCHER_DEBOUNCE_MS:-5000}
      USE_POLLING: ${WATCHER_USE_POLLING:-false}
      POLLING_INTERVAL_MS: ${WATCHER_POLLING_INTERVAL_MS:-2000}
    volumes:
      - ${WORKSPACES_PATH:-/tmp/workspaces}:/workspaces:ro
    networks: [mai]
    depends_on:
      redis:
        condition: service_healthy
      mai-registry:
        condition: service_healthy

  mai-memory-mcp:
    build: ./mai-memory-mcp
    restart: unless-stopped
    environment:
      PORT: 3458
      REDIS_URL: redis://redis:6379
    networks: [mai]
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3458/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  mai-dispatcher:
    build: ./mai-dispatcher
    restart: unless-stopped
    ports: ["3460:3460"]
    environment:
      PORT: 3460
      REDIS_URL: redis://redis:6379
      REGISTRY_URL: http://mai-registry:3459
      PROJECT_MCP_URL: http://mai-project-mcp:3456
      CODE_MCP_URL: http://mai-code-mcp:3457
      MEMORY_MCP_URL: http://mai-memory-mcp:3458
      CONFIG_PATH: /config/agents.yml
      REINDEX_TIMEOUT_MS: ${REINDEX_TIMEOUT_MS:-30000}
    volumes:
      - ./config/agents.yml:/config/agents.yml:ro
      - ${WORKSPACES_PATH:-/tmp/workspaces}:/workspaces:ro
    networks: [mai]
    depends_on:
      redis:
        condition: service_healthy
      mai-registry:
        condition: service_healthy
      mai-project-mcp:
        condition: service_started
      mai-code-mcp:
        condition: service_started
      mai-memory-mcp:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3460/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  mai-dashboard:
    build: ./mai-dashboard
    restart: unless-stopped
    ports: ["3461:3461"]
    environment:
      PORT: 3461
      REGISTRY_URL: http://mai-registry:3459
      PROJECT_MCP_URL: http://mai-project-mcp:3456
      DISPATCHER_URL: http://mai-dispatcher:3460
      REDIS_URL: redis://redis:6379
      DASHBOARD_SECRET: ${DASHBOARD_SECRET:-changeme}
    networks: [mai]
    depends_on:
      redis:
        condition: service_healthy
      mai-registry:
        condition: service_healthy
      mai-dispatcher:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3461/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis-data:
  qdrant-data:
  registry-data:
  project-db:

networks:
  mai:
    driver: bridge

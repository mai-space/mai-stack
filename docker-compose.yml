name: mai-stack

x-ollama: &ollama-env
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}

services:

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes: [redis-data:/data]
    networks: [mai]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    volumes: [qdrant-data:/qdrant/storage]
    networks: [mai]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:6333/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  mai-registry:
    build: ./mai-registry
    restart: unless-stopped
    environment:
      PORT: 3459
      DB_PATH: /data/registry.db
      CONFIG_PATH: /config/projects.yml
      REDIS_URL: redis://redis:6379
    volumes:
      - registry-data:/data
      - ./config/projects.yml:/config/projects.yml:ro
    ports: ["3459:3459"]
    networks: [mai]
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3459/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  mai-project-mcp:
    build: ./mai-project-mcp
    restart: unless-stopped
    environment:
      PORT: 3456
      HOST: "0.0.0.0"
      DB_PATH: /data/mai.db
      REDIS_URL: redis://redis:6379
    volumes: [project-db:/data]
    networks: [mai]
    depends_on:
      redis:
        condition: service_healthy

  mai-code-mcp:
    build: ./mai-code-mcp
    restart: unless-stopped
    environment:
      <<: *ollama-env
      PORT: 3457
      QDRANT_URL: http://qdrant:6333
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-ollama:nomic-embed-text}
      REGISTRY_URL: http://mai-registry:3459
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      COHERE_API_KEY: ${COHERE_API_KEY:-}
    volumes:
      - ${WORKSPACES_PATH:-/tmp/workspaces}:/workspaces:ro
    networks: [mai]
    depends_on:
      qdrant:
        condition: service_healthy
      mai-registry:
        condition: service_healthy

  mai-watcher:
    build: ./mai-watcher
    restart: unless-stopped
    environment:
      REDIS_URL: redis://redis:6379
      REGISTRY_URL: http://mai-registry:3459
      DEBOUNCE_MS: ${WATCHER_DEBOUNCE_MS:-5000}
      USE_POLLING: ${WATCHER_USE_POLLING:-false}
      POLLING_INTERVAL_MS: ${WATCHER_POLLING_INTERVAL_MS:-2000}
    volumes:
      - ${WORKSPACES_PATH:-/tmp/workspaces}:/workspaces:ro
    networks: [mai]
    depends_on:
      redis:
        condition: service_healthy
      mai-registry:
        condition: service_healthy

  mai-memory-mcp:
    build: ./mai-memory-mcp
    restart: unless-stopped
    environment:
      PORT: 3458
      REDIS_URL: redis://redis:6379
    networks: [mai]
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3458/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  mai-journal:
    build: ./mai-journal
    restart: unless-stopped
    environment:
      PORT: 3462
      DB_PATH: /data/journal.db
      REDIS_URL: redis://redis:6379
    volumes: [journal-db:/data]
    networks: [mai]
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3462/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  mai-dispatcher:
    build: ./mai-dispatcher
    restart: unless-stopped
    ports: ["3460:3460"]
    environment:
      PORT: 3460
      REDIS_URL: redis://redis:6379
      REGISTRY_URL: http://mai-registry:3459
      PROJECT_MCP_URL: http://mai-project-mcp:3456
      CODE_MCP_URL: http://mai-code-mcp:3457
      MEMORY_MCP_URL: http://mai-memory-mcp:3458
      JOURNAL_URL: http://mai-journal:3462
      CONFIG_PATH: /config/agents.yml
      REINDEX_TIMEOUT_MS: ${REINDEX_TIMEOUT_MS:-30000}
      # Off by default — same dev-mode bypass pattern as DASHBOARD_SECRET. Set true once
      # mai-dispatcher is reachable from outside localhost (see M-6.md "Dispatcher: session auth").
      DISPATCHER_AUTH_REQUIRED: ${DISPATCHER_AUTH_REQUIRED:-false}
    volumes:
      - ./config/agents.yml:/config/agents.yml:ro
      - ${WORKSPACES_PATH:-/tmp/workspaces}:/workspaces:ro
    networks: [mai]
    depends_on:
      redis:
        condition: service_healthy
      mai-registry:
        condition: service_healthy
      mai-project-mcp:
        condition: service_started
      mai-code-mcp:
        condition: service_started
      mai-memory-mcp:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3460/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  mai-runner:
    build: ./mai-runner
    restart: unless-stopped
    ports: ["3463:3463"]
    environment:
      PORT: 3463
      REDIS_URL: redis://redis:6379
      DISPATCHER_URL: http://mai-dispatcher:3460
      JOURNAL_URL: http://mai-journal:3462
      CONFIG_PATH: /config/agents.yml
      PROJECTS_CONFIG_PATH: /config/projects.yml
      RUNNER_MAX_GLOBAL_WORKTREES: ${RUNNER_MAX_GLOBAL_WORKTREES:-2}
      RUNNER_POLL_INTERVAL_MS: ${RUNNER_POLL_INTERVAL_MS:-15000}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENCODE_ZEN_API_KEY: ${OPENCODE_ZEN_API_KEY:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    volumes:
      - ./config/agents.yml:/config/agents.yml:ro
      - ./config/projects.yml:/config/projects.yml:ro
      # rw — unlike every other service's :ro mount, mai-runner creates git worktrees here.
      # runtime.type: ddev additionally needs Docker access, which this default compose file
      # deliberately does NOT wire up — see M-6.md RISK 1 and docker-compose.prod.yml for the
      # socket-proxy pattern before enabling ddev-backed projects.
      - ${WORKSPACES_PATH:-/tmp/workspaces}:/workspaces
    networks: [mai]
    depends_on:
      redis:
        condition: service_healthy
      mai-dispatcher:
        condition: service_healthy
      mai-journal:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3463/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  mai-dashboard:
    build: ./mai-dashboard
    restart: unless-stopped
    ports: ["3461:3461"]
    environment:
      PORT: 3461
      REGISTRY_URL: http://mai-registry:3459
      PROJECT_MCP_URL: http://mai-project-mcp:3456
      DISPATCHER_URL: http://mai-dispatcher:3460
      JOURNAL_URL: http://mai-journal:3462
      RUNNER_URL: http://mai-runner:3463
      REDIS_URL: redis://redis:6379
      DASHBOARD_SECRET: ${DASHBOARD_SECRET:-changeme}
    networks: [mai]
    depends_on:
      redis:
        condition: service_healthy
      mai-registry:
        condition: service_healthy
      mai-dispatcher:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3461/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis-data:
  qdrant-data:
  registry-data:
  project-db:
  journal-db:

networks:
  mai:
    driver: bridge

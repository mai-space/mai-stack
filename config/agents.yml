agents:
  # ── External (pull-only) agents — unchanged from M1-M5 ──────────────────────
  # A human runs these locally; they connect to the dispatcher and claim tasks.

  - id: cursor-claude
    type: cursor
    mode: external
    model_provider: anthropic
    model: claude-sonnet-5
    task_types: [code, refactor, review]
    max_concurrent_tasks: 2
    project_affinity: [app-a]
    budget:
      daily_usd: 5.00
      per_task_usd: 0.50
    rate_limit:
      requests_per_minute: 10
      on_429: exponential_backoff
      on_budget_90pct: graceful_shutdown

  - id: opencode-cheap
    type: opencode
    mode: external
    model_provider: openai
    model: gpt-4o-mini
    task_types: [boilerplate, docs, tests]
    max_concurrent_tasks: 3
    budget:
      daily_usd: 2.00
    rate_limit:
      requests_per_minute: 30
      on_429: sleep_30s

  - id: opencode-smart
    type: opencode
    mode: external
    model_provider: openai
    model: o3
    task_types: [architecture, hard-bugs]
    max_concurrent_tasks: 1
    budget:
      daily_usd: 15.00
      per_task_usd: 3.00
    rate_limit:
      requests_per_minute: 5
      on_429: exponential_backoff

  - id: junie
    type: junie
    mode: external
    model_provider: anthropic
    model: claude-opus-5
    task_types: [planning, architecture, review]
    max_concurrent_tasks: 1
    budget:
      daily_usd: 10.00
    rate_limit:
      requests_per_minute: 5
      on_budget_90pct: graceful_shutdown

  # ── Managed agents (M6) ──────────────────────────────────────────────────────
  # mai-runner starts, supervises, and tears these down itself — no human involved.
  # See M-6.md "Agent Adapters — the 9 supported backends" for the full adapter table.

  - id: managed-claude-php
    type: claude-cli                     # cli-family adapter — spawns a subprocess per attempt
    mode: managed
    model_provider: anthropic
    model: claude-sonnet-5
    task_types: [code, refactor, tests]
    project_affinity: [legacy-erp]
    max_parallel_worktrees: 2
    max_gate_retries: 3
    cli:
      command: claude
      args: ["-p", "--permission-mode", "acceptEdits", "--mcp-config", "{worktree}/.mcp.json"]
      timeout_minutes: 30
    budget:
      daily_usd: 8.00
      per_task_usd: 1.00
    rate_limit:
      requests_per_minute: 10
      on_429: exponential_backoff
      on_budget_90pct: graceful_shutdown

  - id: managed-anthropic-direct
    type: anthropic-api                  # api-family adapter — no subprocess, in-process tool-use loop
    mode: managed
    model_provider: anthropic
    model: claude-sonnet-5
    task_types: [code, tests]
    project_affinity: [app-a]
    max_parallel_worktrees: 2
    max_gate_retries: 3
    api:
      base_url: https://api.anthropic.com
      api_key_env: ANTHROPIC_API_KEY
      model: claude-sonnet-5
      timeout_minutes: 30
    budget:
      daily_usd: 8.00
      per_task_usd: 1.00
    rate_limit:
      requests_per_minute: 10
      on_429: exponential_backoff
      on_budget_90pct: graceful_shutdown

  - id: managed-opencode-boilerplate
    type: opencode-agent
    mode: managed
    model_provider: openai
    model: gpt-4o-mini
    task_types: [boilerplate, docs, tests]
    project_affinity: [app-b]
    max_parallel_worktrees: 2
    max_gate_retries: 2
    cli:
      command: opencode
      args: ["run"]
      timeout_minutes: 20
    budget:
      daily_usd: 3.00
    rate_limit:
      requests_per_minute: 20
      on_429: sleep_30s

  - id: managed-junie
    type: junie-cli                      # cli-family adapter — .junie/mcp/mcp.json, bridged via mcp-remote
    mode: managed
    model_provider: anthropic
    model: claude-opus-5
    task_types: [planning, architecture, review]
    max_parallel_worktrees: 1
    max_gate_retries: 3
    cli:
      command: junie
      args: ["--brave=auto"]
      timeout_minutes: 30
    budget:
      daily_usd: 10.00
    rate_limit:
      requests_per_minute: 5
      on_budget_90pct: graceful_shutdown

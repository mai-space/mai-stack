agents:
  - id: claude
    type: claude-code
    model_provider: anthropic
    model: claude-sonnet-4-6
    task_types: [code, refactor, review, planning, architecture, hard-bugs]
    max_concurrent_tasks: 2
    project_affinity: [bgm-pulheim]
    budget:
      daily_usd: 10.00
      per_task_usd: 1.00
    rate_limit:
      requests_per_minute: 10
      on_429: exponential_backoff
      on_budget_90pct: graceful_shutdown

  - id: opencode-deepseek
    type: opencode
    model_provider: opencode-go
    model: deepseek-v4-pro
    task_types: [code, refactor, hard-bugs, architecture]
    max_concurrent_tasks: 2
    project_affinity: [bgm-pulheim]
    budget:
      daily_usd: 5.00
    rate_limit:
      requests_per_minute: 20
      on_429: exponential_backoff

  - id: opencode-qwen
    type: opencode
    model_provider: opencode-go
    model: qwen3.5-plus
    task_types: [boilerplate, docs, tests, code]
    max_concurrent_tasks: 3
    project_affinity: [bgm-pulheim]
    budget:
      daily_usd: 3.00
    rate_limit:
      requests_per_minute: 30
      on_429: sleep_30s

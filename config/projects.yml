projects:
  - id: bgm-pulheim
    name: "www.bgm-pulheim.org"
    workspace: /workspaces/www.bgm-pulheim.org
    agents_md: /workspaces/www.bgm-pulheim.org/AGENTS.md
    system_prompt_override: |
      TYPO3 14 project with 28 extensions, developed via DDEV.
      Read AGENTS.md before any work. Custom extensions live under the
      mai_* namespace; prefer native TYPO3 APIs over third-party extensions.
    allowed_agents:
      - claude
      - cursor-auto
      - junie
      - opencode-qwen
      - opencode-deepseek-pro
      - opencode-deepseek-flash
      - opencode-copilot-sonnet
    embedding:
      model: ollama:nomic-embed-text
      reindex_threshold_minutes: 15

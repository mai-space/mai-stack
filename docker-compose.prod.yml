# Production overrides for a root-server deployment. Merge with the base file:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# What this changes:
# - Adds Caddy as the only service with host port bindings (80/443) — every other
#   service's `ports:` from the base file is cleared here, so it's reachable only on
#   the internal `mai` Docker network. Even mai-dashboard and mai-dispatcher, the two
#   services meant to be reachable from outside, go through Caddy rather than a raw
#   host port (see M-6.md "Production Deployment").
# - restart: always everywhere, and per-service memory ceilings — mai-runner's is the
#   one that matters most: every concurrent ddev-backed worktree is a full PHP-FPM +
#   MySQL stack (see M-6.md RISK 3). Size RUNNER_MAX_GLOBAL_WORKTREES (base compose
#   file / .env) to whatever this ceiling can actually hold.
# - Turns on DISPATCHER_AUTH_REQUIRED, since mai-dispatcher is now reachable from the
#   public internet via Caddy (see M-6.md "Dispatcher: session auth").
# - Documents (commented out) the docker-socket-proxy pattern required before enabling
#   any project with runtime.type: ddev — see M-6.md RISK 1. Do not mount
#   /var/run/docker.sock into mai-runner directly.

services:
  caddy:
    image: caddy:2-alpine
    restart: always
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [mai]
    depends_on:
      - mai-dashboard
      - mai-dispatcher

  redis:
    restart: always
    mem_limit: 512m

  qdrant:
    restart: always
    mem_limit: 1g

  mai-registry:
    restart: always
    ports: []
    mem_limit: 256m

  mai-project-mcp:
    restart: always
    mem_limit: 256m

  mai-code-mcp:
    restart: always
    mem_limit: 1g

  mai-watcher:
    restart: always
    mem_limit: 256m

  mai-memory-mcp:
    restart: always
    mem_limit: 256m

  mai-journal:
    restart: always
    mem_limit: 256m

  mai-dispatcher:
    restart: always
    ports: []
    mem_limit: 512m
    environment:
      DISPATCHER_AUTH_REQUIRED: "true"

  mai-runner:
    restart: always
    ports: []
    mem_limit: 2g
    # Required only once a project sets runtime.type: ddev — see M-6.md RISK 1.
    # Bring up docker-socket-proxy (below) first, then point ddev/docker CLI in
    # mai-runner at it instead of the default /var/run/docker.sock:
    # environment:
    #   DOCKER_HOST: tcp://docker-socket-proxy:2375
    # depends_on:
    #   - docker-socket-proxy

  mai-dashboard:
    restart: always
    ports: []
    mem_limit: 512m

  # Uncomment once any project needs runtime.type: ddev. Restricts what mai-runner can
  # do with Docker to container/network/image lifecycle — never mount the raw socket.
  # docker-socket-proxy:
  #   image: tecnativa/docker-socket-proxy
  #   restart: always
  #   environment:
  #     CONTAINERS: "1"
  #     NETWORKS: "1"
  #     IMAGES: "1"
  #     EXEC: "1"
  #     POST: "1"
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock:ro
  #   networks: [mai]

volumes:
  caddy-data:
  caddy-config:
